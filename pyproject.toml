[project]
name = "repomate-lite"
version = "0.1.0"
description = "RAG-based Q&A over a single GitHub repository (hybrid search, syntax-aware chunking)."
requires-python = ">=3.11"

# Dependencies are added incrementally as modules are implemented; kept out of this
# scaffold commit to avoid pinning versions before implementation begins.
dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
